# ============================================================
# RiaLoader.ini  —— 本文件编码必须保持 UTF-8
# 文件名必须与 RiaLoader.exe 同名
# 本文件是 RiaLoader 工程自带的模板；实际部署时通常使用
# 与 HookFont.dll 同名的 HookFont.ini（见 src/HookFont/HookFont.ini）
# ============================================================

[RiaLoader]
# 游戏的主程序文件名
TargetEXE = ojyousama.exe
# 需要注入的 DLL 数量
TargetDLLCount = 1
# 依次列出要注入的 DLL 文件名
TargetDLLName_0 = HookFont.dll
