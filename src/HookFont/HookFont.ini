# ============================================================
# HookFont.ini  —— 本文件编码必须保持 UTF-8
# 文件名必须与 HookFont.dll 同名（例如改为 xxx.dll 则改名为 xxx.ini）
# 部署：把 HookFont.dll / HookFont.exe / HookFont.ini 三个文件
#       一起复制到游戏目录，用记事本改好配置后双击 HookFont.exe
# ============================================================

# ------------------------------------------------------------
# [RiaLoader]  启动器配置（由 HookFont.exe 读取）
# ------------------------------------------------------------
[RiaLoader]
# 游戏的主程序文件名（可写相对本目录的文件名，或绝对路径）
TargetEXE = ojyousama.exe
# 需要注入的 DLL 数量
TargetDLLCount = 2
# 依次列出要注入的 DLL 文件名（个数需与 TargetDLLCount 一致）
TargetDLLName_0 = HookFont.dll
TargetDLLName_1 = kDays.dll

# ------------------------------------------------------------
# [HookFont]  字体替换配置（由 HookFont.dll 读取）
# ------------------------------------------------------------
[HookFont]
# 强制使用的字符集。0x86 = GB2312(简体中文)，0x81 = 日文，
# DEFAULT_CHARSET = 1（由系统选择）。支持 0x 十六进制或十进制写法。
Charset = 0x86
# 强制使用的字体名（必须是系统已安装的字体）。
# 支持候选列表：用英文逗号或中文逗号分隔，程序会自动选用第一个系统已安装的字体。
# 例：FontName = 黑体, 微软雅黑, 宋体
FontName = 黑体

# 是否 Hook 对应的字体创建 API（A=ANSI版，W=Unicode版）。
# 一般建议全部开启；若个别游戏调用 W 版报错可单独关掉。
HookCreateFontA = true
HookCreateFontIndirectA = true
HookCreateFontW = true
HookCreateFontIndirectW = true

# 是否 Hook DirectWrite 引擎（IDWriteFactory::CreateTextFormat / CreateTextLayout，
# 以及 IDWriteTextLayout::SetFontFamilyName）。
# 使用 WPF / Unity 等现代渲染引擎的游戏走 DirectWrite 而非 GDI CreateFont，
# 开启后这类游戏也能被替换字体。默认开启，无副作用。
HookDirectWrite = true

# 是否 Hook GDI+ 引擎（GdipCreateFontFamilyFromName）。
# 少数老游戏 / 引擎通过 GDI+ 创建字体，开启后同样会被替换。默认开启。
HookGdiplus = true

# 是否自动注册 DLL 同目录 fonts\ 子目录里的字体（*.ttf / *.ttc / *.otf）。
# 若目标字体（FontName / FontMap 里写的）系统没装，可以把字体文件放进
# 游戏目录下的 fonts\ 文件夹，启动时会自动 AddFontResource 注册，
# 无需手动安装、不需要管理员权限。不想要就直接把 fonts\ 文件夹删掉。
AutoInstallFonts = true

# 可选：替换游戏窗口标题（翻译补丁常用）。不需要就保持 false。
HookWindowTitle = false
# 原窗口标题（要匹配的标题）
RawWindowTitle =
# 替换后的新窗口标题
NewWindowTitle =

# 可选：字符级文本替换（ExtTextOut / TextOut 逐字符映射）。
# 某些引擎锁定内部字体、不走 CreateFont，或个别字符在目标字体里无法显示
# （日文假名 / 全角标点变成豆腐块）时，用下方的 [CharMap] 表把字符逐字替换。
# 注意：TextOut 内部会转调 ExtTextOut，因此只需 Hook ExtTextOut，无需重复 Hook。
# 默认关闭（开启会引入少量额外处理开销，不需要就别开）。
HookTextOut = false

# 可选：字形级替换（GetGlyphOutlineA/W）。
# 少数引擎不渲染文本、直接调用 GetGlyphOutline 抓取字形位图（老 DirectX 光栅化），
# 字体替换与 ExtTextOut 字符替换都覆盖不到；开启后同样按 [CharMap] 把字符
# 换成目标字形再取轮廓。与 HookTextOut 配合使用。默认关闭。
HookGlyphOutline = false

# ------------------------------------------------------------
# [CharMap]  字符级替换表（可选，需配合 HookTextOut = true）
# 格式：源字符 = 目标字符（左右都必须是单个字符）
# 作用：通过 ExtTextOut / TextOut 绘制的文本，绘制前会把"源字符"逐个换成"目标字符"。
# 典型用途：把日文标点/假名换成中文字形相似的字符，解决锁定字体下的豆腐块。
# 例：  「 = “       」（全角左引号 → 中文左引号）
#       あ = 阿      （字形近似的假名 → 汉字，用于字形替换法汉化）
# 注意：ExtTextOutA（ANSI 版）只对值在 0x00-0xFF 内的条目生效，按字节替换。
# ------------------------------------------------------------
[CharMap]
# 「 = “
# 」 = ”
# 『 = ‘
# 』 = ’
# あ = 阿

# ------------------------------------------------------------
# [FontMap]  按"原字体名 → 新字体名"精确替换（可选）
# 键 = 游戏请求的字体名，值 = 替换成的字体（值也可以写候选列表）
# 命中这里的字体优先于上面 [HookFont] 段 FontName 的全局替换；
# 未命中的字体仍会走 FontName 全局替换（若 FontName 留空则只替换命中的字体）。
# 典型用途：只把日文字体（MS Gothic / 游明朝 等）换成中文字体，避免误伤系统界面。
# 支持通配符：* 匹配任意字符序列，? 匹配单个字符（不区分大小写）。
# 例如 "MS* = 黑体" 会命中 MS Gothic / MS UI Gothic / MS 明朝 等所有 MS 开头的字体。
# 精确匹配优先于通配匹配；多个通配都命中时，取配置里最先写的那一条。
# ------------------------------------------------------------
[FontMap]
# MS Gothic = 黑体
# MS* = 黑体
# *Gothic* = 黑体
# 游明朝 = 黑体
