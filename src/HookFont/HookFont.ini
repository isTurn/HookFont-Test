# ============================================================
# HookFont.ini  —— 本文件编码必须保持 UTF-8
# 文件名必须与 HookFont.dll 同名（例如改为 xxx.dll 则改名为 xxx.ini）
# 部署：把 HookFont.dll / HookFont.exe / HookFont.ini 三个文件
#       一起复制到游戏目录，用记事本改好配置后双击 HookFont.exe
# ============================================================

# ------------------------------------------------------------
# [RiaLoader]  启动器配置（由 HookFont.exe 读取）
# ------------------------------------------------------------
[RiaLoader]
# 游戏的主程序文件名（可写相对本目录的文件名，或绝对路径）
TargetEXE = ojyousama.exe
# 需要注入的 DLL 数量
TargetDLLCount = 2
# 依次列出要注入的 DLL 文件名（个数需与 TargetDLLCount 一致）
TargetDLLName_0 = HookFont.dll
TargetDLLName_1 = kDays.dll

# ------------------------------------------------------------
# [HookFont]  字体替换配置（由 HookFont.dll 读取）
# ------------------------------------------------------------
[HookFont]
# 强制使用的字符集。0x86 = GB2312(简体中文)，0x81 = 日文，
# DEFAULT_CHARSET = 1（由系统选择）。支持 0x 十六进制或十进制写法。
Charset = 0x86
# 强制使用的字体名（必须是系统已安装的字体）。
# 支持候选列表：用英文逗号或中文逗号分隔，程序会自动选用第一个系统已安装的字体。
# 例：FontName = 黑体, 微软雅黑, 宋体
FontName = 黑体

# 是否 Hook 对应的字体创建 API（A=ANSI版，W=Unicode版）。
# 一般建议全部开启；若个别游戏调用 W 版报错可单独关掉。
HookCreateFontA = true
HookCreateFontIndirectA = true
HookCreateFontW = true
HookCreateFontIndirectW = true

# 是否 Hook DirectWrite 引擎（IDWriteFactory::CreateTextFormat）。
# 使用 WPF / Unity 等现代渲染引擎的游戏走 DirectWrite 而非 GDI CreateFont，
# 开启后这类游戏也能被替换字体。默认开启，无副作用。
HookDirectWrite = true

# 可选：替换游戏窗口标题（翻译补丁常用）。不需要就保持 false。
HookWindowTitle = false
# 原窗口标题（要匹配的标题）
RawWindowTitle =
# 替换后的新窗口标题
NewWindowTitle =

# ------------------------------------------------------------
# [FontMap]  按"原字体名 → 新字体名"精确替换（可选）
# 键 = 游戏请求的字体名，值 = 替换成的字体（值也可以写候选列表）
# 命中这里的字体优先于上面 [HookFont] 段 FontName 的全局替换；
# 未命中的字体仍会走 FontName 全局替换（若 FontName 留空则只替换命中的字体）。
# 典型用途：只把日文字体（MS Gothic / 游明朝 等）换成中文字体，避免误伤系统界面。
# ------------------------------------------------------------
[FontMap]
# MS Gothic = 黑体
# 游明朝 = 黑体
