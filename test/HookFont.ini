[RiaLoader]
TargetEXE = TestTarget.exe
TargetDLLCount = 1
TargetDLLName_0 = HookFont.dll

[HookFont]
Charset = 0x86
CharsetSpoof = false
FontName = 宋体, 黑体
HookCreateFontA = true
HookCreateFontIndirectA = true
HookCreateFontW = true
HookCreateFontIndirectW = true
HookDirectWrite = true
HookGdiplus = true
AutoInstallFonts = true
HookWindowTitle = true
RawWindowTitle = TestTitle
NewWindowTitle = 汉化版标题
HookTextOut = true
HookGlyphOutline = true
AutoSC = true

# --- tier-1 enhanced config (round 2) ---
FontSizeScale = 150
MinFontSize = 16
LineHeightScale = 200
CPRedirectCodePage = 65001
HookDrawText = true
FaceNameSpoof = true
EnumFontSpoof = true

[FontMap]
MS Gothic = 黑体
MS* = 黑体
# 故意缺：验证 [FontCheck] 缺失告警
MissingFont = 完全不存在字体XYZ

[CharMap]
「 = “
」 = ”
あ = 阿

# 按进程名覆盖：只对 TestTarget.exe 生效，验证多配置段覆盖逻辑。
# 全局 FontName = 宋体, 黑体（第一个已装通常为宋体）；此处覆盖为 黑体，
# 初始化日志应显示 Font=黑体（而非宋体）。
[HookFont:TestTarget.exe]
FontName = 黑体
